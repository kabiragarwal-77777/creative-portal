# ============================================================
# NGINX CONFIG FOR CREATIVE PORTAL — UNIVEST INTERNAL SERVER
#
# TO APPLY: copy relevant server block to your nginx sites-available
# and reload nginx: sudo nginx -s reload
# ============================================================

upstream portal_main {
    server [::1]:3000;
}

upstream portal_intelligence {
    server [::1]:3001;
}

upstream portal_scanner {
    server [::1]:3002;
}

upstream portal_google_creative {
    server [::1]:3003;
}

upstream portal_audience {
    server [::1]:3004;
}

upstream portal_feedback {
    server [::1]:3005;
}

upstream portal_trends {
    server [::1]:3006;
}

upstream portal_ci {
    server [::1]:3007;
}

server {
    listen 443 ssl;
    server_name internal.univest.in;

    proxy_connect_timeout 600s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    send_timeout 600s;
    client_max_body_size 100M;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /creative-portal/ {
        proxy_pass http://portal_main/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /analytics/api/ {
        proxy_pass http://portal_scanner/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
        proxy_read_timeout 600s;
    }

    location /intel/api/ {
        proxy_pass http://portal_intelligence/api/intel/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 600s;
    }

    location /ci/api/ {
        proxy_pass http://portal_ci/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 600s;
    }

    location /google-creative/api/ {
        proxy_pass http://portal_google_creative/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 600s;
    }
}

server {
    listen 80;
    server_name internal.univest.in;
    return 301 https://$server_name$request_uri;
}
