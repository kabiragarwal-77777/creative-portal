<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Performance Marketing Auto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg-body: #08080d;
            --bg-nav: #0f0f18;
            --bg-tab: #1a1a2e;
            --bg-active: #6c5ce7;
            --text: #e2e2e2;
            --text-muted: #888;
            --border: #2a2a3e;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-body);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .top-nav {
            display: flex;
            align-items: center;
            gap: 0;
            background: var(--bg-nav);
            border-bottom: 1px solid var(--border);
            padding: 0 24px;
            height: 52px;
            flex-shrink: 0;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-right: 32px;
        }

        .brand-icon {
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, #6c5ce7, #00d4aa);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 800;
            color: #fff;
        }

        .brand-text {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: -0.3px;
            color: var(--text);
        }

        .brand-text span {
            color: var(--text-muted);
            font-weight: 400;
        }

        .tabs {
            display: flex;
            gap: 2px;
            height: 100%;
            align-items: flex-end;
            flex: 1;
        }

        .nav-tools {
            display: none;
        }

        .assistant-context {
            font-size: 11px;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .assistant-entry {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 4px;
        }

        .assistant-entry input {
            width: 270px;
            border: none;
            background: transparent;
            color: var(--text);
            font-size: 12px;
            padding: 6px 8px;
            outline: none;
            font-family: inherit;
        }

        .assistant-entry input::placeholder {
            color: var(--text-muted);
        }

        .assistant-btn {
            border: none;
            background: var(--bg-active);
            color: #fff;
            font-size: 12px;
            font-weight: 700;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
        }

        .assistant-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .assistant-quick {
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-muted);
            font-size: 11px;
            padding: 6px 8px;
            border-radius: 999px;
            cursor: pointer;
            font-family: inherit;
        }

        .assistant-panel {
            position: fixed;
            top: 64px;
            right: 20px;
            width: min(520px, calc(100vw - 40px));
            max-height: calc(100vh - 84px);
            background: rgba(15, 15, 24, 0.98);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 22px 60px rgba(0, 0, 0, 0.45);
            padding: 16px;
            z-index: 20;
            display: none;
            overflow: auto;
        }

        .assistant-panel.open {
            display: block;
        }

        .assistant-panel-header {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .assistant-panel-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text);
        }

        .assistant-panel-sub {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 3px;
            line-height: 1.45;
        }

        .assistant-close {
            border: none;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 16px;
        }

        .assistant-section {
            border-top: 1px solid var(--border);
            padding-top: 12px;
            margin-top: 12px;
        }

        .assistant-section h4 {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .assistant-answer {
            font-size: 13px;
            line-height: 1.6;
            color: var(--text);
            white-space: pre-wrap;
        }

        .assistant-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .assistant-item {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 12px;
            color: var(--text);
            line-height: 1.5;
        }

        @media (max-width: 1200px) {
            .top-nav {
                padding: 8px 16px;
                height: auto;
                flex-wrap: wrap;
            }

            .tabs {
                order: 3;
                width: 100%;
                overflow-x: auto;
                padding-bottom: 4px;
            }

            .nav-tools {
                margin-left: auto;
                flex-wrap: wrap;
                justify-content: flex-end;
            }

            .assistant-entry input {
                width: 220px;
            }
        }

        .tab {
            padding: 10px 24px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            cursor: pointer;
            border: none;
            background: transparent;
            border-radius: 8px 8px 0 0;
            transition: all 0.2s;
            font-family: inherit;
            position: relative;
        }

        .tab:hover {
            color: var(--text);
            background: rgba(108, 92, 231, 0.1);
        }

        .tab.active {
            color: #fff;
            background: var(--bg-active);
        }

        .tab.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--bg-active);
        }

        .tab-icon {
            margin-right: 6px;
        }

        .frame-container {
            flex: 1;
            position: relative;
        }

        .frame-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            background: var(--bg-body);
        }

        .frame-container iframe.hidden {
            visibility: hidden;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <nav class="top-nav">
        <div class="brand">
            <div class="brand-icon">PM</div>
            <div class="brand-text">Performance Marketing <span>Auto</span></div>
        </div>
        <div class="tabs">
            <button class="tab active" data-tab="creative">
                <span class="tab-icon">&#9632;</span> Meta Portal
            </button>
            <button class="tab" data-tab="uploader">
                <span class="tab-icon">&#9650;</span> Meta Ad Upload
            </button>
            <button class="tab" data-tab="scanner">
                <span class="tab-icon">&#9670;</span> Inventory Scanner
            </button>
            <button class="tab" data-tab="ci">
                <span class="tab-icon">&#9733;</span> Competitor Intel
            </button>
            <button class="tab" data-tab="google">
                <span class="tab-icon">G</span> Google Portal
            </button>
            <button class="tab" data-tab="trends">
                <span class="tab-icon">&#128202;</span> Trend Scanner
            </button>
            <button class="tab" data-tab="feedback">
                <span class="tab-icon">&#129504;</span> Self-Learning
            </button>
        </div>
        <div class="nav-tools">
            <div class="assistant-context" id="assistantContextSummary">Meta Portal • awaiting view context</div>
            <div class="assistant-entry">
                <button class="assistant-quick" data-quick-prompt="I think data is wrong here">Check Data</button>
                <button class="assistant-quick" data-quick-prompt="Which campaign should I scale right now for max ROAS?">Scale Now</button>
                <button class="assistant-quick" data-quick-prompt="The optimizer shows very limited actions. Why?">Why Limited?</button>
                <input type="text" id="assistantPromptInput" placeholder="Ask about this view...">
                <button class="assistant-btn" id="assistantAskBtn">Ask</button>
            </div>
        </div>
    </nav>
    <div class="frame-container">
        <iframe id="frame-creative" src="creative.html?v=47"></iframe>
        <iframe id="frame-uploader" src="uploader/upload.html?v=8" class="hidden"></iframe>
        <iframe id="frame-scanner" src="inventory-scanner/public/index.html" class="hidden" allow="popups" sandbox="allow-same-origin allow-scripts allow-popups allow-popups-to-escape-sandbox allow-forms allow-top-navigation"></iframe>
        <iframe id="frame-ci" src="inventory-scanner/public/ci.html" class="hidden" allow="popups" sandbox="allow-same-origin allow-scripts allow-popups allow-popups-to-escape-sandbox allow-forms allow-top-navigation"></iframe>
        <iframe id="frame-google" src="google-creative.html" class="hidden" sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-top-navigation"></iframe>
        <iframe id="frame-trends" src="trend-scanner.html" class="hidden" sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-top-navigation"></iframe>
        <iframe id="frame-feedback" src="feedback.html?v=100" class="hidden" sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-top-navigation"></iframe>
    </div>
    <div class="assistant-panel" id="assistantPanel">
        <div class="assistant-panel-header">
            <div>
                <div class="assistant-panel-title">View Assistant</div>
                <div class="assistant-panel-sub" id="assistantPanelSub">Context-aware answers for the active portal view.</div>
            </div>
            <button class="assistant-close" id="assistantCloseBtn">&#10005;</button>
        </div>
        <div class="assistant-section" style="margin-top:0;padding-top:0;border-top:none;">
            <h4>Answer</h4>
            <div class="assistant-answer" id="assistantAnswer">Ask a question about the active view.</div>
        </div>
        <div class="assistant-section">
            <h4>Checks</h4>
            <div class="assistant-list" id="assistantChecks">
                <div class="assistant-item">Waiting for analysis.</div>
            </div>
        </div>
        <div class="assistant-section">
            <h4>Next Steps</h4>
            <div class="assistant-list" id="assistantActions">
                <div class="assistant-item">The assistant will suggest focused next steps here.</div>
            </div>
        </div>
    </div>

    <script>
        const tabs = document.querySelectorAll('.tab');
        const frames = {
            creative: document.getElementById('frame-creative'),
            uploader: document.getElementById('frame-uploader'),
            scanner: document.getElementById('frame-scanner'),
            ci: document.getElementById('frame-ci'),
            google: document.getElementById('frame-google'),
            trends: document.getElementById('frame-trends'),
            feedback: document.getElementById('frame-feedback'),
        };
        const assistantPromptInput = document.getElementById('assistantPromptInput');
        const assistantAskBtn = document.getElementById('assistantAskBtn');
        const assistantPanel = document.getElementById('assistantPanel');
        const assistantContextSummary = document.getElementById('assistantContextSummary');
        const assistantPanelSub = document.getElementById('assistantPanelSub');
        const assistantAnswer = document.getElementById('assistantAnswer');
        const assistantChecks = document.getElementById('assistantChecks');
        const assistantActions = document.getElementById('assistantActions');
        let assistantContext = {
            app: 'meta',
            view: 'dashboard',
            title: 'Meta Portal',
            dateRange: { label: '--' },
            dataMode: { label: 'Awaiting context' },
            diagnostics: { source: 'Portal shell' },
        };

        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                const target = tab.dataset.tab;
                Object.entries(frames).forEach(([key, frame]) => {
                    frame.classList.toggle('hidden', key !== target);
                });
                refreshAssistantContext();
            });
        });

        document.querySelectorAll('[data-quick-prompt]').forEach(btn => {
            btn.addEventListener('click', () => {
                assistantPromptInput.value = btn.dataset.quickPrompt || '';
                runAssistantQuery();
            });
        });

        document.getElementById('assistantCloseBtn').addEventListener('click', () => {
            assistantPanel.classList.remove('open');
        });

        assistantAskBtn.addEventListener('click', runAssistantQuery);
        assistantPromptInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') runAssistantQuery();
        });

        window.addEventListener('message', (event) => {
            if (!event || !event.data || event.data.type !== 'portal-context') return;
            assistantContext = event.data.context || assistantContext;
            renderAssistantContextSummary();
        });

        function getActiveTabKey() {
            const active = document.querySelector('.tab.active');
            return active ? active.dataset.tab : 'creative';
        }

        function buildFallbackContext() {
            const activeTab = getActiveTabKey();
            const activeLabel = document.querySelector('.tab.active')?.textContent?.trim() || 'Portal';
            return {
                app: activeTab,
                view: activeTab,
                title: activeLabel,
                dateRange: { label: 'Not published by this view yet' },
                dataMode: { label: 'Context unavailable' },
                diagnostics: { source: 'Host shell fallback' },
            };
        }

        function refreshAssistantContext() {
            const frame = frames[getActiveTabKey()];
            try {
                if (frame && frame.contentWindow && typeof frame.contentWindow.getPortalAssistantContext === 'function') {
                    assistantContext = frame.contentWindow.getPortalAssistantContext() || assistantContext;
                } else {
                    assistantContext = buildFallbackContext();
                }
            } catch (err) {
                assistantContext = buildFallbackContext();
            }
            renderAssistantContextSummary();
        }

        function renderAssistantContextSummary() {
            const title = assistantContext.title || 'Portal';
            const view = assistantContext.view || 'view';
            const range = assistantContext.dateRange?.label || '--';
            const mode = assistantContext.dataMode?.label || '--';
            assistantContextSummary.textContent = `${title} • ${view} • ${range} • ${mode}`;
            assistantPanelSub.textContent = `${title} • ${range} • ${mode}`;
        }

        function renderAssistantResponse(payload) {
            const checks = Array.isArray(payload?.checks) && payload.checks.length ? payload.checks : ['No structured checks returned.'];
            const actions = Array.isArray(payload?.next_steps) && payload.next_steps.length ? payload.next_steps : ['No next steps returned.'];
            assistantAnswer.textContent = payload?.answer || 'No answer returned.';
            assistantChecks.innerHTML = checks.map(item => `<div class="assistant-item">${escapeHtml(item)}</div>`).join('');
            assistantActions.innerHTML = actions.map(item => `<div class="assistant-item">${escapeHtml(item)}</div>`).join('');
            assistantPanel.classList.add('open');
        }

        async function runAssistantQuery() {
            const prompt = assistantPromptInput.value.trim();
            if (!prompt) return;
            refreshAssistantContext();
            assistantAskBtn.disabled = true;
            assistantAnswer.textContent = 'Thinking through the active view...';
            assistantChecks.innerHTML = '<div class="assistant-item">Reading active view context.</div>';
            assistantActions.innerHTML = '<div class="assistant-item">Preparing a focused answer.</div>';
            assistantPanel.classList.add('open');

            const system = [
                'You are a concise analytics copilot for the active portal view.',
                'Use the provided JSON context as the source of truth for the current screen.',
                'Return strict JSON with keys: answer (string), checks (array of strings), next_steps (array of strings).',
                'Keep the answer high-signal and practical.',
                'If the user asks about data quality, mention date range, maturity mode, and any diagnostics from context.',
            ].join(' ');
            const promptBody = `Active view context:\n${JSON.stringify(assistantContext, null, 2)}\n\nUser question:\n${prompt}`;

            try {
                const res = await fetch('/api/ai/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ system, prompt: promptBody, max_tokens: 2200 }),
                });
                const data = await res.json();
                if (!data.success) throw new Error(data.error || 'Assistant request failed');
                renderAssistantResponse(JSON.parse(data.content));
            } catch (err) {
                renderAssistantResponse({
                    answer: `The assistant could not complete the analysis: ${err.message}`,
                    checks: [
                        `Context view: ${assistantContext.view || 'unknown'}`,
                        `Date range: ${assistantContext.dateRange?.label || '--'}`,
                        `Data mode: ${assistantContext.dataMode?.label || '--'}`,
                    ],
                    next_steps: ['Retry the question after the current view finishes loading.'],
                });
            } finally {
                assistantAskBtn.disabled = false;
            }
        }

        function escapeHtml(value) {
            return String(value || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        refreshAssistantContext();
    </script>
</body>
</html>
